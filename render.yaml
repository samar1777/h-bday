services:
  - type: web
    name: whatsapp-bday-bot
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 3000
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: FILEBASE_KEY
        sync: false
      - key: FILEBASE_SECRET
        sync: false
      - key: FILEBASE_BUCKET
        sync: false
      - key: FILEBASE_ENDPOINT
        value: https://s3.filebase.io
      - key: FILEBASE_REGION
        value: us-east-1
